app:
  host: "0.0.0.0"
  port: 8000
  debug: false
  projects_dir: "projects"
  log_level: "INFO"

tools:
  colmap: null
  ffmpeg: null
  ffprobe: null

extraction:
  fps: 6
  max_frames: 3000
  min_frames: 15
  quality: 98
  resize_width: null

frame_selection:
  config_file: "config/frame_scoring.yaml"

reconstruction:
  config_file: "config/reconstruction.yaml"

quality:
  voxel_size: 0.4
  high_confidence_min_points_per_voxel: 6
  medium_confidence_min_points_per_voxel: 3
  high_confidence_max_reprojection_error: 1.2
  medium_confidence_max_reprojection_error: 2.5
  min_cameras_per_region: 3
  score_weights:
    camera_registration: 0.30
    track_length: 0.20
    reprojection_error: 0.20
    point_density: 0.15
    spatial_coverage: 0.15
