weights:
  sharpness: 0.30
  exposure: 0.15
  feature_density: 0.25
  feature_uniformity: 0.20
  viewpoint_gain: 0.10

sharpness:
  normalization_cap: 500.0

exposure:
  good_range_low: 40
  good_range_high: 215
  overexpose_penalty: 0.5
  underexpose_penalty: 0.5

feature_detection:
  detector: "ORB"
  max_features: 2000
  normalization_count: 1500
  grid_size: 4

selection:
  min_quality_threshold: 0.20
  target_selection_ratio: 0.30
  min_selected_frames: 20
  max_selected_frames: 600
  temporal_windows: 10
  min_per_window: 2
  ssim_redundancy_threshold: 0.92
